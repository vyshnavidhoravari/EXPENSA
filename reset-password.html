
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | EXPENSA</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .reset-card {
            max-width: 440px;
            margin: 80px auto;
            padding: 32px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }
        .reset-card h1 {
            color: #102f28;
            margin-bottom: 10px;
        }
        .reset-card p {
            color: #64748b;
            margin-bottom: 24px;
        }
        .reset-card label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }
        .reset-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .reset-card button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #26765b;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        #resetMessage {
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="reset-card">
        <h1>Create a new password</h1>
        <p>Enter and confirm your new EXPENSA account password.</p>

        <form id="resetForm">
            <label for="newPassword">New password</label>
            <input
                type="password"
                id="newPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Enter new password"
                required
            >

            <label for="confirmPassword">Confirm password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                placeholder="Confirm new password"
                required
            >

            <button type="submit" id="resetButton">
                Update Password
            </button>

            <p id="resetMessage" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
